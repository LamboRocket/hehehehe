<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Postcards Home — Enchanted Escape Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-title: 'Great Vibes', cursive;
            --font-display: 'Fredoka', cursive;
            --font-body: 'Quicksand', sans-serif;
            --card-radius: 24px;
            --gold-glow: 0 0 18px rgba(254, 211, 48, 0.7);
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            --primary-accent: #fd79a8;
            --secondary-accent: #6c5ce7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 10px;
            overflow-x: hidden;
            background: #110826;
            color: #2d3436;
            touch-action: manipulation;
        }

        /* Floating Background Particles */
        .fairy-dust-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dust {
            position: absolute;
            font-size: 1.2rem;
            animation: floatUp 8s infinite ease-in-out;
            opacity: 0.7;
            filter: drop-shadow(0 0 6px #ffeaa7);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }

            50% {
                opacity: 0.9;
                transform: translateY(50vh) rotate(180deg) scale(1.1);
            }

            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.6);
                opacity: 0;
            }
        }

        #app {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 10;
            padding-bottom: 20px;
        }

        /* HEADER & STAMP TRACKER */
        .magic-header {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(12px);
            border-radius: var(--card-radius);
            padding: 16px 14px;
            box-shadow: var(--card-shadow);
            text-align: center;
            border: 3px solid #ffeaa7;
        }

        .magic-header h1 {
            font-family: var(--font-title);
            font-size: 2.8rem;
            background: linear-gradient(45deg, #fd79a8, #6c5ce7, #fdcb6e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 2px;
        }

        .magic-header .subtitle {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6c5ce7;
            margin-bottom: 10px;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .stamp {
            height: 28px;
            border-radius: 8px;
            border: 2px dashed #b2bec3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 700;
            color: #b2bec3;
            background: #f8f9fa;
        }

        .stamp.current {
            border: 2px solid #fd79a8;
            background: #ffeaa7;
            color: #e84393;
            transform: scale(1.05);
            box-shadow: var(--gold-glow);
        }

        .stamp.done {
            border: 2px solid #00b894;
            background: linear-gradient(135deg, #55efc4, #00b894);
            color: #fff;
        }

        .progress-bar {
            height: 8px;
            background: #dfe6e9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fd79a8, #a29bfe, #00b894);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* ROOM CARD CONTAINER */
        .room-card {
            border-radius: var(--card-radius);
            padding: 20px 18px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            position: relative;
            background: #fff;
            transition: all 0.4s ease;
        }

        .room-tag {
            font-family: var(--font-display);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c5ce7;
            font-weight: 700;
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: #2d3436;
            margin-top: -2px;
        }

        .story-box {
            font-size: 0.9rem;
            line-height: 1.45;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 14px;
            border-left: 4px solid #a29bfe;
            border-radius: 0 14px 14px 0;
            color: #2d3436;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        /* POLAROID FRAME */
        .polaroid {
            background: #fff;
            padding: 10px 10px 14px 10px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transform: rotate(-1deg);
            text-align: center;
        }

        .polaroid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .polaroid .caption {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: #fd79a8;
            margin-top: 4px;
        }

        /* PUZZLE GAME ZONE */
        .game-zone {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: 16px 12px;
            border: 2px dashed #a29bfe;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        /* INPUTS & BUTTONS - TOUCH OPTIMIZED */
        .magic-input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 2px solid #a29bfe;
            border-radius: 14px;
            font-family: var(--font-display);
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            text-transform: uppercase;
            background: #fff;
        }

        .magic-input:focus {
            border-color: #e84393;
            box-shadow: var(--gold-glow);
        }

        .btn-magic {
            width: 100%;
            min-height: 50px;
            background: linear-gradient(45deg, #fd79a8, #6c5ce7);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-magic:active {
            transform: scale(0.98);
        }

        /* WIDGET STYLES */
        .scratch-container {
            position: relative;
            width: 100%;
            height: 140px;
            border-radius: 14px;
            overflow: hidden;
            touch-action: none;
        }

        .scratch-secret {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffeaa7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            color: #d63031;
        }

        canvas.scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .popcorn-box {
            width: 100%;
            height: 140px;
            background: #2d3436;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
        }

        .popcorn-item {
            position: absolute;
            font-size: 2rem;
            cursor: pointer;
            animation: fall 2.2s linear infinite;
        }

        @keyframes fall {
            0% {
                top: -40px;
            }

            100% {
                top: 150px;
            }
        }

        .tv-display {
            background: #000;
            color: #55efc4;
            font-family: monospace;
            font-size: 1.5rem;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            letter-spacing: 4px;
        }

        .remote-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 220px;
        }

        .btn-num {
            height: 44px;
            border-radius: 10px;
            border: none;
            background: #dfe6e9;
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .dial-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .dial-box {
            width: 75px;
            height: 90px;
            background: #2d3436;
            color: #ffeaa7;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            font-family: var(--font-display);
            font-size: 1.1rem;
        }

        .btn-dial {
            background: #636e72;
            color: #fff;
            border: none;
            width: 100%;
            height: 26px;
            border-radius: 6px;
        }

        .lego-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
            width: 100%;
            max-width: 180px;
            min-height: 120px;
            border-bottom: 4px solid #636e72;
            padding-bottom: 2px;
        }

        .lego-block {
            height: 28px;
            border-radius: 6px;
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
        }

        .feedback-box {
            font-family: var(--font-display);
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .feedback-box.err {
            color: #d63031;
        }

        .feedback-box.ok {
            color: #00b894;
        }

        .hint-btn {
            background: none;
            border: none;
            color: #6c5ce7;
            font-family: var(--font-display);
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
        }

        .hint-card {
            display: none;
            background: #fffbe6;
            border: 2px solid #ffeaa7;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #d63031;
            width: 100%;
            text-align: center;
        }

        .hint-card.show {
            display: block;
        }

        /* FINAL SANCTUARY */
        .wax-envelope {
            background: #fff;
            border: 3px solid #fd79a8;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: var(--card-shadow);
            cursor: pointer;
        }

        .wax-seal {
            width: 65px;
            height: 65px;
            background: #d63031;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
            font-size: 2rem;
            margin: 12px auto;
            box-shadow: 0 4px 12px rgba(214, 48, 49, 0.4);
        }

        .letter-text {
            font-family: var(--font-title);
            font-size: 1.5rem;
            line-height: 1.5;
            color: #2d3436;
            text-align: left;
            white-space: pre-line;
            background: #fffdfa;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #ffeaa7;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .chat-bubble.me {
            align-self: flex-end;
            background: #6c5ce7;
            color: #fff;
        }

        .chat-bubble.her {
            align-self: flex-start;
            background: #dfe6e9;
            color: #2d3436;
        }

        .countdown-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .count-unit {
            background: #2d3436;
            color: #ffeaa7;
            padding: 8px 4px;
            border-radius: 10px;
            text-align: center;
        }

        .count-unit .num {
            font-size: 1.1rem;
            font-family: var(--font-display);
        }

        .count-unit .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #a29bfe;
        }
    </style>
</head>

<body>

    <div class="fairy-dust-container" id="dustContainer"></div>
    <div id="app"></div>

    <script>
        /* ============ MEDIA PLACEHOLDERS ============ */
        const IMAGES = {
            valentines: "valentines.JPG",
            warMuseum: "mesum.jpg",
            toiletGift: "toilet.jpeg",
            firstDate: "first.JPG",
            beach: "beach.jpeg",
            mcflurry: "oreo.jpeg",
            digitalCam: "school.JPG",
            matchingOutfits: "matching.JPG",
            squishyWalk: "squizy.jpeg",
            birthdayEscape: "birthday.JPEG",
            mcdonaldsStudy: "mcdo.jpeg"
        };

        const AUDIO_GOODNIGHT_NOTE = "Sam Goodnight Message - 2026-06-21.m4a";

        /* ============ 16 WHIMSICAL ESCAPE ROOM PUZZLES ============ */
        const STAGES = [
            {
                id: 1,
                bg: "linear-gradient(135deg, #2a085c, #631c72)",
                tag: "Room 1 ✦ The Enchanted Studio",
                title: "The Magic Painting Canvas",
                story: "I used to peep through the opposite classroom window at you sitting at your desk, but our fairytale really began in art class sitting a few rows down! Scratch off the gray paint to discover the hidden passcode!",
                photo: IMAGES.digitalCam,
                caption: "Where our story first began ✨",
                type: "scratchCanvas",
                secretText: "CODE: 1121",
                answer: "1121",
                hint: "Use your finger to scrub off all the gray paint until the 4-digit code is clear!"
            },
            {
                id: 2,
                bg: "linear-gradient(135deg, #09203f, #537895)",
                tag: "Room 2 ✦ Place D'Orleans Mall",
                title: "First Date Memory Sequence",
                story: "Our first date at Place D’Orleans was pure magic! Arrange these 4 moments in the EXACT order they happened on that day:",
                photo: IMAGES.firstDate,
                caption: "First date at Place D'Orleans 💖",
                type: "reorder",
                items: [
                    { id: "A", text: "💐 Gave paper flowers & asked to be girlfriend" },
                    { id: "B", text: "🍟 Ate New York Fries together" },
                    { id: "C", text: "🍬 Dollarama trip for Nerds Gummy Clusters" },
                    { id: "D", text: "🎨 Made custom bead bracelets together" }
                ],
                correctOrder: ["D", "A", "B", "C"],
                hint: "We made bracelets first, then gave paper flowers, grabbed fries, and ended with candy!"
            },
            {
                id: 3,
                bg: "linear-gradient(135deg, #0f0c20, #150a21)",
                tag: "Room 3 ✦ Starlight Cinema",
                title: "Popcorn Arcade Lock",
                story: "Around Christmas time, we had our first kiss in the cozy movie theater! Tap 3 falling popcorn buckets to reveal the secret theater door code!",
                type: "popcornGame",
                targetScore: 3,
                revealedCode: "The Grinch",
                answer: "The Grinch",
                hint: "Tap 3 popcorn buckets as they float down to reveal the door passphrase!"
            },
            {
                id: 4,
                bg: "linear-gradient(135deg, #134e5e, #71b280)",
                tag: "Room 4 ✦ Whispering Flower Garden",
                title: "Pink Tulip Blossom Cipher",
                story: "On Valentine's Day, I got you your favorite pink tulips! Tap each flower stem to bloom secret letters, then spell the store name where they came from!",
                photo: IMAGES.valentines,
                caption: "Pink tulips for my favorite girl 🌷",
                type: "tulipGarden",
                answer: "SOBEYS",
                hint: "The 6 letters unscramble to name the grocery store starting with 'S'!"
            },
            {
                id: 5,
                bg: "linear-gradient(135deg, #182848, #4b6cb7)",
                tag: "Room 5 ✦ Binge Watching Lounge",
                title: "The Magical TV Remote",
                story: "Count the total number of letters in these 4 show names we binge-watch: [BROOKLYN NINE NINE] + [THE ROOKIE] + [CHICAGO MED] + [FRIENDS]. Key in that total sum channel!",
                type: "tvRemote",
                answer: "43",
                hint: "Add up: 17 + 9 + 10 + 7"
            },
            {
                id: 6,
                bg: "linear-gradient(135deg, #3a1c71, #d76d77)",
                tag: "Room 6 ✦ Birthday Escape Vault",
                title: "Samwel's Combination Safe",
                story: "On my birthday, we did an escape room with my family! You got me a chain and a little animal for my keychain...",
                photo: IMAGES.birthdayEscape,
                caption: "Birthday escape room & steak dinner 🎂",
                type: "safeDial",
                answer: "M-DUCK",
                hint: "Dial 1 is the letter 'M', Dial 2 is 'DUCK'!"
            },
            {
                id: 7,
                bg: "linear-gradient(135deg, #4b1248, #f0c27b)",
                tag: "Room 7 ✦ The Crafting Workshop",
                title: "Cardboard Throne Crafting",
                story: "For your birthday, I hand-crafted a cardboard toilet packed with gifts! Select ONLY the 3 real materials I used to craft it from the workshop table below:",
                photo: IMAGES.toiletGift,
                caption: "The famous handcrafted cardboard toilet! 📦",
                type: "craftBench",
                correctItems: ["📦 Cardboard", "✂️ Tape", "🎁 Gifts"],
                hint: "Select Cardboard, Tape, and Gifts! Avoid Metal and Glass."
            },
            {
                id: 8,
                bg: "linear-gradient(135deg, #200122, #6f0000)",
                tag: "Room 8 ✦ Lego Store Castle",
                title: "The $5,000 Tower Stacker",
                story: "Solve the Lego color riddle: 1st is Love, 2nd is Ocean, 3rd is Sun, 4th is Grass. Tap the colored bricks to stack them in order!",
                type: "legoStacker",
                correctSequence: ["RED", "BLUE", "YELLOW", "GREEN"],
                hint: "Stack in order: Red -> Blue -> Yellow -> Green!"
            },
            {
                id: 9,
                bg: "linear-gradient(135deg, #004e92, #000428)",
                tag: "Room 9 ✦ Skip-Bo & Uno Lounge",
                title: "The Winning Play Stack",
                story: "We play endless card games together! In Skip-Bo, building piles start at 1 and build sequentially up to what highest number?",
                type: "textKey",
                answer: "12",
                hint: "A standard Skip-Bo building pile completes at card 12."
            },
            {
                id: 10,
                bg: "linear-gradient(135deg, #360033, #0b8793)",
                tag: "Room 10 ✦ Roblox Adopt Me Sanctuary",
                title: "The Hatching Golden Egg",
                story: "Tap the magical Golden Egg 5 times to break it open and reveal the escape passcode held inside!",
                type: "eggHatch",
                requiredClicks: 5,
                revealedCode: "Donkey Sam",
                answer: "Donkey Sam",
                hint: "Keep tapping the egg fast until it hatches!"
            },
            {
                id: 11,
                bg: "linear-gradient(135deg, #2c3e50, #fd746c)",
                tag: "Room 11 ✦ Enchanted Library",
                title: "The Bookworm Quote",
                story: "You love reading books a LOT a lot! Complete this quote: 'Shatter... Unravel...'",

                answer: "ME",
                hint: "The missing word is plural for 'life' (L I V E S)!"
            },
            {
                id: 12,
                bg: "linear-gradient(135deg, #1c92d2, #f2fcfe)",
                tag: "Room 12 ✦ War Museum Bus Window",
                title: "Frosty Window Memory",
                story: "On our December school trip to the War Museum, where on did you rest your head during the bus ride?",
                photo: IMAGES.warMuseum,
                caption: "Resting your head on my shoulder ❄️",
                type: "textKey",
                answer: "SHOULDER",
                hint: "S _ O U L D E R"
            },
            {
                id: 13,
                bg: "linear-gradient(135deg, #fc4a1a, #f7b733)",
                tag: "Room 13 ✦ Candy Vault & Secret Code",
                title: "Signature Goodnight Word",
                story: "Unscramble these mixed-up candy letters to reveal our signature goodbye word: [O G O R N E]",
                type: "textKey",
                answer: "GOONER",
                hint: "Starts with G and ends with R!"
            },
            {
                id: 14,
                bg: "linear-gradient(135deg, #11998e, #38ef7d)",
                tag: "Room 14 ✦ McDonald's Study Lounge",
                title: "Oreo McFlurry Blender",
                story: "Select the 2 correct McFlurry ingredients, then press the Blender button to mix!",
                photo: IMAGES.mcdonaldsStudy,
                caption: "Zero seconds of actual studying happened! 🍦",
                type: "blenderGame",
                correctIngs: ["🍪 Oreo Crumbs", "🍦 Vanilla Cream"],
                hint: "Select Oreo Crumbs and Vanilla Cream, then blend!"
            },
            {
                id: 15,
                bg: "linear-gradient(135deg, #8a2387, #e94057)",
                tag: "Room 15 ✦ Memory Scrapbook Arcade",
                title: "Match Our Core Memories",
                story: "Flip and match all 4 pairs of memory cards (McFlurry, Beach, Cheese Squishy, NY Fries) to unlock the final sanctuary key!",
                photo: IMAGES.matchingOutfits,
                caption: "Matching outfits together ❤️",
                type: "memoryGame",
                hint: "Tap cards to flip them over and find matching pairs!"
            },
            {
                id: 16,
                bg: "linear-gradient(135deg, #2a085c, #e94057)",
                tag: "Room 16 ✦ Goodnight Sanctuary",
                title: "Postcards Home — Samwel & Mwyah",
                story: "You conquered all 15 escape challenges, myah! Break the wax seal to open your final letter, audio note, and date countdown.",
                photo: IMAGES.squishyWalk,
                caption: "Walking with our cheese squishy 🧀",
                audioSrc: AUDIO_GOODNIGHT_NOTE,
                type: "finalSanctuary",
                messages: [
                    { sender: "me", text: "This is Sam texting to tell you about your 5000$ purchase at the Lego store." },
                    { sender: "her", text: "Oh!" },
                    { sender: "her", text: "SAAAAMMMMM" }
                ],
                letter: "Dear Mwyah,\n\nFrom sitting rows away from each other in art class (and you walking in socks in class) to building cardboard toilets, eating New York Fries at Place D’Orleans, and resting your head on my shoulder on the museum bus... you are my favorite person in the whole wide world.\n\nThank you for every goodnight messages, every game of Uno and Skip-Bo, every Lego set, and every time we ate at McDonald's. I can't wait for our hangout on August 21st, 2026 at 10:00 AM!\n\nSee you later gooner,\nSamwel ❤️"
            }

        /* ============ GAME STATE ============ */

        /* ============ INTERACTIVE PUZZLE LOGIC ============ */
        function toggleHint() {
            const el = document.getElementById("hintCard");
            if (el) el.classList.toggle("show");
        }

        function checkAnswer(expected) {
            const input = document.getElementById("puzzleInput");
            if (!input) return;
            const cleanUser = input.value.trim().toUpperCase();
            const cleanTarget = expected.trim().toUpperCase();

            if (cleanUser === cleanTarget) {
                feedbackMsg = "✨ Correct passcode! Unlocking room...";
                feedbackStatus = "ok";
                render();
                nextStage();
            } else {
                feedbackMsg = "❌ Incorrect passcode! Try again or tap for a hint.";
                feedbackStatus = "err";
                render();
            }
        }

        function moveReorder(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= userReorderList.length) return;
            const tmp = userReorderList[idx];
            userReorderList[idx] = userReorderList[target];
            userReorderList[target] = tmp;
            render();
        }

        function checkReorder() {
            const stage = STAGES[currentStageIndex];
            if (userReorderList.every((val, i) => val === stage.correctOrder[i])) {
                feedbackMsg = "✨ First date timeline restored!";
                feedbackStatus = "ok";
                render();
                nextStage();
            } else {
                feedbackMsg = "❌ Sequence incorrect! Remember the order of our first date!";
                feedbackStatus = "err";
                render();
            }
        }

        function tapPopcorn() {
            popcornCaught++;
            render();
        }

        function bloomFlower(el, letter) {
            el.innerText = letter;
            el.style.fontFamily = "var(--font-display)";
            el.style.fontWeight = "bold";
            el.style.color = "#e84393";
        }

        function pressRemote(key) {
            if (key === 'CLR') tvInputValue = "";
            else if (tvInputValue.length < 3) tvInputValue += key;
            render();
        }

        function submitRemote() {
            const stage = STAGES[currentStageIndex];
            if (tvInputValue === stage.answer) {
                feedbackMsg = "✨ Correct channel tuned!";
                feedbackStatus = "ok";
                render();
                nextStage();
            } else {
                feedbackMsg = "❌ Wrong channel sum! Count all show letters!";
                feedbackStatus = "err";
                tvInputValue = "";
                render();
            }
        }

        function changeDial(wheel, dir) {
            if (wheel === 1) {
                let idx = dial1List.indexOf(dial1Value) + dir;
                if (idx < 0) idx = dial1List.length - 1;
                if (idx >= dial1List.length) idx = 0;
                dial1Value = dial1List[idx];
            } else {
                let idx = dial2List.indexOf(dial2Value) + dir;
                if (idx < 0) idx = dial2List.length - 1;
                if (idx >= dial2List.length) idx = 0;
                dial2Value = dial2List[idx];
            }
            render();
        }

        function checkSafeCombination() {
            if (dial1Value === "M" && dial2Value === "DUCK") {
                feedbackMsg = "✨ Combination accepted! Vault unlocked!";
                feedbackStatus = "ok";
                render();
                nextStage();
            } else {
                feedbackMsg = "❌ Safe combination locked! Check your memories!";
                feedbackStatus = "err";
                render();
            }
        }

        function toggleCraft(item) {
            if (selectedCrafts.includes(item)) {
                selectedCrafts = selectedCrafts.filter(i => i !== item);
            } else if (selectedCrafts.length < 3) {
                selectedCrafts.push(item);
            }
            render();
        }

        function checkCraftBench() {
            const stage = STAGES[currentStageIndex];
            const isMatch = stage.correctItems.every(i => selectedCrafts.includes(i)) && selectedCrafts.length === 3;
            if (isMatch) {
                feedbackMsg = "✨ Throne constructed successfully!";
                feedbackStatus = "ok";
                render();
                nextStage();
            } else {
                feedbackMsg = "❌ Incorrect materials selected! Choose the 3 exact items used.";
                feedbackStatus = "err";
                render();

        function getLegoHex(color) {
            switch (color) {
                case 'RED': return '#ff7875';
                case 'BLUE': return '#69c0ff';
                case 'YELLOW': return '#ffd666';
                case 'GREEN': return '#95de64';
                default: return '#ccc';

                userLegoStack.push(color);

                nextStage();

            if (memFlipped.length === 2 || memFlipped.includes(idx) || memMatched.includes(idx)) return;
            memFlipped.push(idx);
            render();

            if (memFlipped.length === 2) {
                const [a, b] = memFlipped;
                if (memIcons[a] === memIcons[b]) {
                    memMatched.push(a, b);

                    if (memMatched.length === memIcons.length) {

            if (audioObj && isAudioPlaying) {
                audioObj.pause();
                isAudioPlaying = false;

                if (audioObj) audioObj.pause();
                audioObj = new Audio(src);
                audioObj.play().catch(() => { });
                isAudioPlaying = true;
                audioObj.onended = () => { isAudioPlaying = false; render(); };
            }
            render();
        }

        function nextStage() {
            setTimeout(() => {
                feedbackMsg = "";
                currentStageIndex++;
                render();
            }, 900);

        /* ============ CANVAS & EVENT SETUP ============ */
        function postRenderSetup() {
            const canvas = document.getElementById("scratchCanvas");
            if (canvas) {
                const ctx = canvas.getContext("2d");
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                ctx.fillStyle = "#b2bec3";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let isScratching = false;

                function scratchPos(e) {
                    if (!isScratching) return;
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;

                    ctx.globalCompositeOperation = "destination-out";
                    ctx.beginPath();
                    ctx.arc(x, y, 22, 0, Math.PI * 2);
                    ctx.fill();
                }

                canvas.addEventListener("mousedown", () => isScratching = true);
                canvas.addEventListener("mouseup", () => isScratching = false);
                canvas.addEventListener("mousemove", scratchPos);
                canvas.addEventListener("touchstart", (e) => { isScratching = true; scratchPos(e); });
                canvas.addEventListener("touchend", () => isScratching = false);
                canvas.addEventListener("touchmove", scratchPos);
            }

            const pInput = document.getElementById("puzzleInput");
            if (pInput) {
                pInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        const stage = STAGES[currentStageIndex];
                        checkAnswer(stage.answer);
                    }
                });
            }

            if (STAGES[currentStageIndex].type === 'finalSanctuary' && waxSealBroken) {
                runCountdownTimer();
            }
        }

        function runCountdownTimer() {
            const targetDate = new Date("August 21, 2026 10:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance > 0) {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    const cdD = document.getElementById("cd-d");
                    const cdH = document.getElementById("cd-h");
                    const cdM = document.getElementById("cd-m");
                    const cdS = document.getElementById("cd-s");

                    if (cdD) cdD.innerText = days;
                    if (cdH) cdH.innerText = hours;
                    if (cdM) cdM.innerText = minutes;
                    if (cdS) cdS.innerText = seconds;
                }
            }, 1000);
        }

        /* INITIALIZE APPLICATION AFTER DOM LOADS */
        document.addEventListener("DOMContentLoaded", () => {
            initFairyDust();
            render();
        });
    </script>
